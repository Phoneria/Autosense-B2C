services:
  web:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/Caddyfile.smoke:/etc/caddy/Caddyfile:ro
  backend:
    environment:
      B2C_FRONTEND_URL: https://localhost:8443
      B2C_SMTP_HOST: mailpit
      B2C_SMTP_PORT: "1025"
      B2C_SMTP_TLS: "false"
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8026:8025"
